name: build and publish container

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regression tests with race detection
        run: go test -race -count=1 ./...
      - name: Static checks
        run: go vet ./...

  release-container:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ko
        uses: imjasonh/setup-ko@v0.7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cs-unifi-bouncer
          sep-tags: ","
          sep-labels: ","
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Build and Push to GHCR with ko
        env:
          KO_DOCKER_REPO: ghcr.io/teifun2
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          VERSION: ${{ steps.meta.outputs.version }}
          PLATFORMS: linux/amd64,linux/arm64,linux/arm
        run: |
          PTAGS=`echo $TAGS | sed 's/cs-unifi-bouncer://g'`
          export SOURCE_DATE_EPOCH=$(date +%s)
          export GOFLAGS="-ldflags=-X=main.version=$VERSION"
          ko build -B --image-label "$LABELS" -t "$PTAGS" --platform=$PLATFORMS .
